<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JuanTrike Demo Screenshots</title>
<style>
  :root { --bg:#F3F5F9; --card:#fff; --text:#15202F; --muted:#5B6778; --border:#DCE2EC; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0F1724; --card:#172233; --text:#E8EEF7; --muted:#9AA8BC; --border:#2A3A52; } }
  :root[data-theme="dark"] { --bg:#0F1724; --card:#172233; --text:#E8EEF7; --muted:#9AA8BC; --border:#2A3A52; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p { color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; }
  figure img { width: 100%; height: auto; border-radius: 8px; display: block; }
  figcaption { font-size: 13px; color: var(--muted); margin-top: 6px; }
  a { color: inherit; }
</style>
</head>
<body>
